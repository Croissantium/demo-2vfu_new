<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>СВФУ | Главная</title>
    <link rel="stylesheet" href="styles/main.css">

<body>
    <header class="header">
        <div class="header__body">
            <div class="header__body-inner">
                <a href="/" class="header__body-logo">СВФУ</a>

                    <a href="#" class="header__body-list-text">Университет</a>

                <md-filled-button form="form-id" value="ok">Ок</md-filled-button>
            </div>

        <div class="home__blocks">
            <div class="home__grid">
                <div class="home__item home__item-banner"></div>

        </div>
        <div class="home__blocks">
            <div class="home__title">
                <p class="home__title-text">Проверка</p>

                    <md-filled-button id="openBtn">Открыть диалоговое окно</md-filled-button>
                </div>
            </div>
            <div class="home__grid">

                <a href="#" class="home__item home__item-link"></a>
                <a href="#" class="home__item home__item-link"></a>
