<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Сайт университета Северо-Восточного федерального университета имени М.К. Аммосова">
    <meta 
        name="keywords" 
        content="СВФУ, Северо-Восточный федеральный университет, университет якутии, NEFU"
    >
    <title>СВФУ | Главная</title>
    <link rel="stylesheet" href="styles/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script src="scripts/main.js" type="module" defer></script>
    <script>
        (function() {
        const html = document.documentElement;

        function applyTheme(theme) {
            html.classList.toggle("dark", theme === "dark");
        }

        const saved = localStorage.getItem("theme");

        if (saved === "light" || saved === "dark") {
            applyTheme(saved);
        } else {
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            applyTheme(prefersDark ? "dark" : "light");
        }
        })();
    </script>
</head>
<body class="body">
    <header class="header">
        <div class="header__body">
            <div class="header__body-inner">
                <a href="/" class="header__body-logo">СВФУ</a>

                </nav>
                <md-filled-button href="login.html">Войти</md-filled-button>

        </div>
    </header>
    <section class="home">

        <div class="home__blocks">

                </div>
            </div>
            <div class="home__grid">
